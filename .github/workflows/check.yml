name: Check recipes and tools

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check recipes and catalog
        run: tools/check-package
      - name: Test maintenance tools
        run: python3 -m unittest discover -s tests -v
      - name: Check whitespace
        run: git diff --check
